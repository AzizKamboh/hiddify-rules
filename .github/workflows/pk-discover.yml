name: Find Pakistani websites

on:
  schedule:
    - cron: '23 4 15 * *' # monthly on the 15th, 04:23 UTC (09:23 PKT), after the new CrUX lists are out
  workflow_dispatch:
    inputs:
      apply:
        description: 'Add sites and open the review issue (untick for a dry run that only shows the log)'
        type: boolean
        default: true

permissions:
  contents: write # commit data/pakistan.txt and data/pakistan-seen.txt
  issues: write   # open the monthly review issue
  actions: write  # start the site build after adding sites

concurrency:
  group: pk-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find Pakistani websites
        run: node scripts/pk-discover.mjs ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      - name: Commit the list
        if: env.APPLY == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pakistan.txt data/pakistan-seen.txt
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          read shown added < pk-review-count.txt
          git commit -m "Pakistani websites: $added added from Wikidata, $shown suggested for review ($(date -u +%Y-%m))"
          git push

      - name: Open the review issue
        if: env.APPLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read shown added < pk-review-count.txt
          if [ "$shown" -gt 0 ] || [ "$added" -gt 0 ]; then
            gh issue create --title "Pakistani website candidates – $(date -u +%Y-%m)" --body-file pk-review.md
          fi

      - name: Rebuild the site with the new sites
        if: env.APPLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read shown added < pk-review-count.txt
          if [ "$added" -gt 0 ]; then gh workflow run sync.yml --ref main; fi
