name: Sync lists and deploy

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC (08:17 PKT)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the generator
        run: npm test

      - name: Build the list index and mirror IP lists
        run: node scripts/build-index.mjs

      - name: Version the script and style URLs
        # browsers cache Pages files for ~10 minutes; a new URL per deploy keeps
        # the page, script and styles from the same version together
        run: |
          v="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M)"
          sed -i "s/__BUILD__/$v/g" public/index.html public/app.js
          grep -c "$v" public/index.html public/app.js

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
